    <h1 class="main-title">ข้อมูลเพิ่มเติม</h1>

    <!-- กล่องข้อความที่ 1: ประวัติการศึกษา -->
    <div class="card">
        <h2 class="card-title"><i class="fas fa-graduation-cap" style="margin-right: 10px;"></i>ประวัติการศึกษา</h2>
        <div style="line-height: 1.8;">
            <p><i class="fas fa-child" style="color: #dc6986; margin-right: 8px;"></i> <strong>ระดับชั้นอนุบาลศึกษา:</strong> โรงเรียนอนุบาลพิมลกิจจานุวัตร</p>
            <p><i class="fas fa-school" style="color: #dc6986; margin-right: 8px;"></i> <strong>ระดับชั้นประถมศึกษา:</strong> โรงเรียนเฮงฮั้ว</p>
            <p><i class="fas fa-university" style="color: #dc6986; margin-right: 8px;"></i> <strong>ระดับชั้นมัธยมศึกษาตอนต้น:</strong> โรงเรียนบ้านบึง “อุตสาหกรรมนุเคราะห์”</p>
            <p><i class="fas fa-user-graduate" style="color: #dc6986; margin-right: 8px;"></i> <strong>ระดับชั้นมัธยมศึกษาตอนปลาย:</strong> โรงเรียนบ้านบึง “อุตสาหกรรมนุเคราะห์”</p>
        </div>
    </div>

    <!-- กล่องข้อความที่ 2: ผลการเรียน -->
    <div class="card">
        <h2 class="card-title"><i class="fas fa-award" style="margin-right: 10px;"></i>ผลการเรียน</h2>
        <div style="line-height: 1.8;">
            <p><strong>ระดับชั้นมัธยมศึกษาตอนต้น:</strong> (กรอกเกรดเฉลี่ย เช่น 3.xx)</p>
