<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลเพิ่มเติม - Thanpicha Prongjit</title>
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            background-color: #2d6ab5;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 40v40a24 24 0 0 0 24 24h0a24 24 0 0 0 24-24V40M36 40h76"/><rect x="280" y="40" width="44" height="84" rx="22"/><line x1="280" y1="82" x2="324" y2="82"/><circle cx="90" cy="310" r="36"/><line x1="62" y1="310" x2="118" y2="310"/><path d="M270 340a40 40 0 0 1 60-36l20-20"/><path d="M260 280c20 10 30 30 30 50"/><path d="M50 180c30 0 30 40 60 40s30-40 60-40"/><path d="M50 220c30 0 30-40 60-40s30 40 60 40"/><line x1="80" y1="180" x2="80" y2="220"/><line x1="140" y1="180" x2="140" y2="220"/><circle cx="300" cy="190" r="20"/><path d="M320 190l30 30"/><path d="M300 170v-20"/><path d="M190 50l-40 40M180 40l20 20"/><rect x="170" y="290" width="40" height="60" rx="8"/><path d="M180 290v-16h20v16"/></svg>');
            background-size: 440px 440px;
            font-family: 'TH Sarabun New', sans-serif; 
            font-size: 22px; 
            margin: 0; 
            padding: 30px 20px; 
            color: #111; 
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* แถบเมนูนำทางแนวตั้งสไลด์ลอยฝั่งซ้าย (Left Sidebar) */
        .left-sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 10px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .left-sidebar a {
            color: #2d6ab5;
            text-decoration: none;
            font-size: 20px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .left-sidebar a:hover {
            background-color: #dc6986;
            color: white;
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(220, 105, 134, 0.4);
        }

        .main-title { 
            text-align: center; 
            color: #ffffff; 
            margin: 15px 0 35px 0; 
            font-size: 3.2rem; 
            font-weight: bold; 
            text-shadow: 0 4px 12px rgba(0,0,0,0.25);
            position: relative;
        }

        .main-title::after {
            content: '';
            display: block;
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #dc6986, #ff9eb5);
            margin: 8px auto 0 auto;
            border-radius: 2px;
        }

        .card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin: 0 auto 25px auto; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
        }

        .card-title { 
            color: #dc6986; 
            margin-top: 0; 
            margin-bottom: 25px; 
            font-size: 2.3rem; 
            font-weight: bold; 
            display: flex;
            align-items: center;
            border-bottom: 2px dashed rgba(220, 105, 134, 0.25);
            padding-bottom: 12px;
        }

        .card-title i {
            background: #fde8ed;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 1.8rem;
            margin-right: 12px;
        }

        /* โครงสร้าง Timeline */
        .timeline {
            position: relative;
            padding-left: 30px;
            border-left: 3px solid #dc6986;
            margin-left: 15px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
