<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - ผลงานและข้อมูลของฉัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           1. SETUP VARIABLES & BASE STYLES
           ========================================== */
        :root {
            --bg-color: #0f172a;          /* สีพื้นหลังหลัก (Dark Navy) */
            --card-bg: #1e293b;           /* สีพื้นหลังการ์ด */
            --primary-color: #38bdf8;     /* สีเน้นหลัก (Cyan Accent) */
            --secondary-color: #818cf8;   /* สีเน้นรอง (Purple Accent) */
            --text-main: #f8fafc;         /* สีตัวหนังสือหลัก */
            --text-muted: #94a3b8;        /* สีตัวหนังสือนำสายตา/จาง */
            --border-color: #334155;      /* สีเส้นขอบ */
            --font-family: 'Prompt', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ==========================================
           2. NAVIGATION BAR (แถบเมนู)
           ========================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* ==========================================
           3. SECTIONS COMMON LAYOUT
           ========================================== */
        section {
            padding: 6rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }

        /* ==========================================
           4. HOME SECTION (หน้าแรก)
           ========================================== */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
        }

        .hero-content {
            flex: 1;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .hero-description {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* รูปภาพโปรไฟล์ */
        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .profile-img {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.4s ease;
        }

        .profile-img:hover {
            transform: scale(1.03);
        }

        /* ปุ่มติดต่อและโซเชียล */
        .social-links {
            display: flex;
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-color);
            transform: translateY(-4px);
        }

        .cta-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: #0f172a;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 1rem;
            transition: opacity 0.3s ease;
        }

        .cta-btn:hover {
            opacity: 0.9;
        }

        /* ==========================================
           5. ABOUT SECTION (ข้อมูลของฉัน)
           ========================================== */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .about-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .about-card h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .skill-tag {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--primary-color);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* ==========================================
           6. PORTFOLIO SECTION (ผลงานของฉัน)
           ========================================== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
        }

        .project-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .project-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            margin-right: 1rem;
        }

        .project-links a:hover {
            text-decoration: underline;
        }

        /* ==========================================
           7. FOOTER
           ========================================== */
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ==========================================
           8. RESPONSIVE DESIGN (สำหรับมือถือ)
           ========================================== */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
            }

            .hero-title {
                font-size: 2.2rem;
            }

            .social-links {
                justify-content: center;
            }

            .profile-img {
                width: 220px;
                height: 220px;
            }

            .nav-links {
                gap: 1rem;
            }
        }
    </sty
