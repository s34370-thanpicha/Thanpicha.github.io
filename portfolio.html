<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานและกิจกรรม - Thanpicha Prongjit</title>
    <style>
        body {
            background-color: #93A06C;
            font-family: 'Sarabun', sans-serif, Tahoma;
            margin: 0;
            padding: 20px;
            color: #000000;
        }

        .main-title {
            text-align: center;
            color: #dc6986;
            margin-top: 30px;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.85);
            max-width: 800px;
            margin: 0 auto 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .back-link {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 15px;
            border-radius: 5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← กลับหน้าหลัก</a>

    <h1 class="main-title">ผลงานและกิจกรรมของฉัน</h1>

    <div class="card">
        <p style="text-align: center;">แสดงเกียรติบัตร รูปภาพกิจกรรม และผลงานต่างๆ</p>
        
        <div class="gallery">
            <img src="activity1.jpg" alt="กิจกรรมที่ 1">
            <img src="activity2.jpg" alt="กิจกรรมที่ 2">
            <img src="activity3.jpg" alt="กิจกรรมที่ 3">
        </div>
    </div>

</body>
</html>
