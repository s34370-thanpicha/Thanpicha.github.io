<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานและกิจกรรม - Thanpicha Prongjit</title>
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #4a72cf; font-family: 'TH Sarabun New', sans-serif; font-size: 22px; margin: 0; padding: 20px; color: #000; }
        .main-title { text-align: center; color: #dc6986; margin: 20px 0; font-size: 3rem; font-weight: bold; }
        .card { background-color: rgba(255, 255, 255, 0.85); max-width: 800px; margin: 0 auto 25px auto; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .back-btn { display: inline-block; background-color: rgba(0, 0, 0, 0.2); color: white; padding: 6px 15px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-bottom: 15px; }
        .back-btn:hover { background-color: rgba(0, 0, 0, 0.4); }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;
            padding: 10px;
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    <h1 class="main-title">ผลงานและกิจกรรมของฉัน</h1>

    <div class="card">
        <div class="gallery">
            <!-- ตัวอย่างรูปภาพกิจกรรม สามารถก็อปปี้เพิ่มรูปได้ -->
            <div class="gallery-item">
                <img src="activity1.jpg" alt="กิจกรรมที่ 1">
                <p style="margin: 8px 0 0 0; font-weight: bold;">กิจกรรม Open House ม.มหิดล</p>
            </div>

            <div class="gallery-item">
                <img src="activity2.jpg" alt="กิจกรรมที่ 2">
                <p style="margin: 8px 0 0 0; font-weight: bold;">กิจกรรมจำลองการจ่ายยา</p>
            </div>

            <div class="gallery-item">
                <img src="activity3.jpg" alt="กิจกรรมที่ 3">
                <p style="margin: 8px 0 0 0; font-weight: bold;">เกียรติบัตรวิชาการ</p>
            </div>
        </div>
    </div>

</body>
</html>
