<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานและกิจกรรม - ธัญพิชชา โปร่งจิต</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'TH Sarabun New', sans-serif;
            font-size: 22px;
        }

        body {
            background-color: #4a72cf;
            margin: 0;
            padding: 40px 20px;
            color: #000000;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* หัวข้อหลักตรงกลาง */
        .main-title {
            text-align: center;
            color: #dc6986;
            font-size: 48px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border: 4px solid #ffffff;
            border-radius: 15px;
            margin: 0 auto 40px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* แสดงผลงานเป็นตารางกริด */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .gallery-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery-card-body {
            padding: 15px;
        }

        .gallery-card-title {
            color: #dc6986;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        /* ปุ่มย้อนกลับ */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }
        
        .back-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← กลับหน้าแรก</a>

        <h1 class="main-title">ผลงานและกิจกรรมของฉัน</h1>

        <div class="gallery-grid">
            
            <div class="gallery-card">
                <img src="https://via.placeholder.com/400x300?text=Open+House+Mahidol" alt="กิจกรรม Open House">
                <div class="gallery-card-body">
                    <h3 class="gallery-card-title">กิจกรรม Mahidol Open House</h3>
                    <p>เข้าร่วมการทดลองปฏิบัติจริง ปรุงยา และเรียนรู้การทำงานของเภสัชกร</p>
                </div>
            </div>

            <div class="gallery-card">
                <img src="https://via.placeholder.com/400x300?text=Activity+2" alt="กิจกรรม">
                <div class="gallery-card-body">
                    <h3 class="gallery-card-title">ชื่อกิจกรรม / ผลงานที่ 2</h3>
                    <p>คำอธิบายสั้นๆ เกี่ยวกับกิจกรรมหรือผลงานนี้</p>
                </div>
            </div>

            <div class="gallery-card">
                <img src="https://via.placeholder.com/400x300?text=Activity+3" alt="กิจกรรม">
                <div class="gallery-card-body">
                    <h3 class="gallery-card-title">ชื่อกิจกรรม / ผลงานที่ 3</h3>
                    <p>คำอธิบายสั้นๆ เกี่ยวกับกิจกรรมหรือผลงานนี้</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
